<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Jobs Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0,0,0);
      background-color: rgba(0,0,0,0.4);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-100">

<div class="container mx-auto p-4">
  <div class="bg-white shadow-md rounded p-6">
    <h2 class="text-xl font-bold mb-4">Current Jobs</h2>
    <div id="jobList">
      <!-- Job items will be inserted here by JavaScript -->
    </div>
    <button id="viewMore" class="bg-black text-white px-4 py-2 rounded mt-4">View More</button>
  </div>
</div>

<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3 id="modalTitle" class="text-lg font-bold"></h3>
    <div id="modalProgress" class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
      <div class="bg-yellow-500 h-2.5 rounded-full" style="width: 25%"></div>
    </div>
    <p id="modalDescription" class="mt-4"></p>
    <h4 class="mt-4 font-bold">Uploaded Files</h4>
    <ul id="modalFiles">
      <!-- File items will be inserted here by JavaScript -->
    </ul>
  </div>
</div>

<script>
  const jobs = [
    { id: '#47681', name: 'John Stevenson', progress: 25 },
    { id: '#19025', name: 'Mark Brian', progress: 74 },
    { id: '#72211', name: 'Olivia Carey', progress: 0 },
    { id: '#67102', name: 'Hamza Den', progress: 46 }
  ];

  const jobList = document.getElementById('jobList');
  jobs.forEach(job => {
    const progressColor = job.progress > 50 ? 'bg-green-500' : 'bg-yellow-500';
    jobList.innerHTML += `
            <div class="flex justify-between items-center mb-4">
                <span class="font-bold">${job.id} ${job.name}</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
                    <div class="${progressColor} h-2.5 rounded-full" style="width: ${job.progress}%"></div>
                </div>
                <span>${job.progress}%</span>
            </div>
        `;
  });

  const modal = document.getElementById('myModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalDescription = document.getElementById('modalDescription');
  const modalFiles = document.getElementById('modalFiles');
  const closeModal = document.getElementsByClassName('close')[0];

  jobList.addEventListener('click', function(event) {
    const job = jobs.find(j => event.target.innerText.includes(j.id));
    if (job) {
      modalTitle.textContent = `${job.id} ${job.name}`;
      modalDescription.textContent = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.';
      modalFiles.innerHTML = `
                <li>File1.jpg</li>
                <li>AortaCloseup.png</li>
            `;
      modal.style.display = 'block';
    }
  });

  closeModal.onclick = function() {
    modal.style.display = 'none';
  }

  window.onclick = function(event) {
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  }
</script>

</body>
</html>
